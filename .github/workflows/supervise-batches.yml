name: supervise-batches
# Hits /api/cron/supervise-batches every 5 minutes. This is the bulk-upload
# supervisor: it reaps stalled jobs and refills concurrency slots from the
# queue, making the pipeline self-healing after a dropped QStash message or a
# killed worker. The happy path dispatches inline (each worker refills on
# completion); this cron is the backstop that recovers orphaned batches.
#
# GitHub Actions remains an independent 5-minute backstop. The Pro deployment
# also runs the vercel.json supervisor cron every minute; LEASE_MS is 7 minutes,
# and inline dispatch covers the happy path.
#
# Auth: the endpoint requires a credential. Set CRON_SECRET on Vercel and add
# the same value as a GitHub Actions secret named CRON_SECRET.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  supervise:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Hit /api/cron/supervise-batches
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET secret is not set."
            echo "Add the same CRON_SECRET value in GitHub Actions and Vercel, then re-run."
            exit 1
          fi
          curl -fsS -H "Authorization: Bearer $CRON_SECRET" \
            https://uiuxskills.com/api/cron/supervise-batches
