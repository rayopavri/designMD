name: warm-db
# Hits /api/cron/warm-db every 5 minutes. Historically this kept Neon from
# autosuspending; the project now runs on Supabase Postgres, which only pauses
# after 7 days of inactivity, so the warmer is largely cosmetic. The load-bearing
# job in this cron is the stuck-single-generate watchdog: it fails any
# generation_jobs row that has been queued/running for more than 5 minutes
# without an update (e.g. after a Vercel SIGKILL). Batch jobs are handled by
# the separate supervise-batches cron.
#
# Set CRON_SECRET on Vercel and add the same value as a GitHub Actions secret
# named CRON_SECRET so this workflow can authenticate.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Hit /api/cron/warm-db
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET secret is not set."
            echo "Add the same CRON_SECRET value in GitHub Actions and Vercel, then re-run."
            exit 1
          fi
          curl -fsS -H "Authorization: Bearer $CRON_SECRET" \
            https://uiuxskills.com/api/cron/warm-db
